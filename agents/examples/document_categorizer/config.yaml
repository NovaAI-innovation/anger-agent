agent_id: "document_categorizer"
agent_type: "task_executor"
agent_seed: "doc-categorizer-seed"

metadata:
  version: "1.0"
  description: "Categorizes documents using mock LLM analysis and routes to outputs"
  use_case: "Deterministic file I/O + Variable LLM inference"

environment:
  INBOX_PATH: "${AGENT_INBOX_PATH:./data/inbox}"
  PROCESSED_PATH: "${AGENT_PROCESSED_PATH:./data/processed}"
  ERRORS_PATH: "${AGENT_ERRORS_PATH:./data/errors}"
  REVIEW_PATH: "${AGENT_REVIEW_PATH:./data/review}"
  LOG_LEVEL: "${LOG_LEVEL:debug}"
  LOG_FILE: "${LOG_FILE:./logs/document_categorizer.log}"

triggers:
  - id: "new_document"
    type: "file_watch"
    path: "${INBOX_PATH}"
    patterns: ["*.txt"]
    workflow_id: "categorize_and_route"
    description: "Watch for new text documents"

workflows:
  categorize_and_route:
    description: "Read document → categorize with LLM → route to appropriate folder"
    timeout_seconds: 30

    steps:
      # Step 1: Read the document content
      - id: "read_document"
        action: "file.read"
        params:
          path: "${trigger.file_path}"
        output: "document_text"
        on_error: "fail"

      # Step 2: Use LLM to analyze and categorize
      - id: "analyze_content"
        action: "llm.analyze"
        params:
          text: "${read_document.document_text}"
          prompt: "Categorize this document and extract relevant tags"
          provider: "mock"
        output: "analysis_result"
        on_error: "fail"

      # Step 3: Create categorization metadata
      - id: "create_metadata"
        action: "json.stringify"
        params:
          data: {
            "filename": "${trigger.file_name}",
            "timestamp": "2026-01-15T10:50:29Z",
            "category": "${analyze_content.analysis_result.category}",
            "tags": "${analyze_content.analysis_result.tags}",
            "confidence": "${analyze_content.analysis_result.confidence}",
            "summary": "${analyze_content.analysis_result.summary}",
            "analysis": "${analyze_content.analysis_result.analysis}"
          }
        output: "metadata_json"
        on_error: "fail"

      # Step 4: Route based on category (deterministic conditional logic)
      - id: "route_by_category"
        action: "conditional"
        condition: "'${analyze_content.analysis_result.category}' == 'error'"

        if_true:
          # Route to error folder
          - id: "write_error_metadata"
            action: "file.write"
            params:
              path: "${ERRORS_PATH}/${trigger.file_name}.meta.json"
              content: "${create_metadata.metadata_json}"
            on_error: "fail"

          - id: "copy_to_errors"
            action: "file.move"
            params:
              source: "${trigger.file_path}"
              dest: "${ERRORS_PATH}/${trigger.file_name}"
            on_error: "fail"

          - id: "log_error_route"
            action: "log"
            params:
              level: "warning"
              message: "⚠ Categorized as ERROR: ${trigger.file_name}"

        if_false:
          # Check if success category
          - id: "check_success"
            action: "conditional"
            condition: "'${analyze_content.analysis_result.category}' == 'success'"

            if_true:
              # Route to processed folder
              - id: "write_success_metadata"
                action: "file.write"
                params:
                  path: "${PROCESSED_PATH}/${trigger.file_name}.meta.json"
                  content: "${create_metadata.metadata_json}"
                on_error: "fail"

              - id: "copy_to_processed"
                action: "file.move"
                params:
                  source: "${trigger.file_path}"
                  dest: "${PROCESSED_PATH}/${trigger.file_name}"
                on_error: "fail"

              - id: "log_success_route"
                action: "log"
                params:
                  level: "info"
                  message: "✓ Categorized as SUCCESS: ${trigger.file_name}"

            if_false:
              # Route to review folder for all other categories
              - id: "write_review_metadata"
                action: "file.write"
                params:
                  path: "${REVIEW_PATH}/${trigger.file_name}.meta.json"
                  content: "${create_metadata.metadata_json}"
                on_error: "fail"

              - id: "copy_to_review"
                action: "file.move"
                params:
                  source: "${trigger.file_path}"
                  dest: "${REVIEW_PATH}/${trigger.file_name}"
                on_error: "fail"

              - id: "log_review_route"
                action: "log"
                params:
                  level: "info"
                  message: "-> Categorized as ${analyze_content.analysis_result.category}: ${trigger.file_name}"

tools:
  - name: "file.read"
    enabled: true
  - name: "file.write"
    enabled: true
  - name: "file.move"
    enabled: true
  - name: "file.find"
    enabled: true
  - name: "json.stringify"
    enabled: true
  - name: "llm.analyze"
    enabled: true
  - name: "log"
    enabled: true

logging:
  level: "${LOG_LEVEL:debug}"
  file: "${LOG_FILE:./logs/document_categorizer.log}"
  format: "text"
  log_triggers: true
  log_workflow_steps: true
  log_tool_calls: true
