# File Validator Agent Configuration
# This agent validates JSON files and organizes them.

# ============================================================================
# AGENT IDENTITY
# ============================================================================

agent_id: "file_validator"
agent_type: "task_executor"
agent_seed: "silver-mountain-dawn-pulse-stellar-whisper-night-four"

# Metadata (for documentation and discovery)
metadata:
  version: "1.0"
  description: "Validates JSON files against schema and organizes them"
  author: "Agent Framework Team"
  created_at: "2025-01-15"

# ============================================================================
# HUB CONNECTIVITY (v0.5 feature)
# ============================================================================

hub:
  enabled: false  # Not connected in v0.1
  endpoint: "ws://localhost:8000"
  hub_seed: "brave-forest-tiger-marble-quantum-seven-shadow-nine"

# ============================================================================
# ENVIRONMENT & PATHS
# ============================================================================

environment:
  INBOX_PATH: "${AGENT_INBOX_PATH:./data/inbox}"
  PROCESSED_PATH: "${AGENT_PROCESSED_PATH:./data/processed}"
  ERRORS_PATH: "${AGENT_ERRORS_PATH:./data/errors}"
  SCHEMA_PATH: "${SCHEMA_PATH:./schema.json}"

# ============================================================================
# TRIGGERS: When should workflows execute?
# ============================================================================

triggers:
  - id: "new_json_file"
    type: "file_watch"
    path: "${INBOX_PATH}"
    patterns: ["*.json"]
    workflow_id: "validate_and_process"
    description: "Watch for new JSON files in inbox"

# ============================================================================
# WORKFLOWS: What should happen when triggered?
# ============================================================================

workflows:
  # Main validation workflow
  validate_and_process:
    description: "Read file, validate against schema, organize into folders"
    timeout_seconds: 60

    steps:
      # Step 1: Read the file
      - id: "read_file"
        action: "file.read"
        params:
          path: "${trigger.file_path}"
        output: "file_content"
        on_error: "fail"

      # Step 2: Parse JSON
      - id: "parse_json"
        action: "json.parse"
        params:
          content: "${read_file.file_content}"
        output: "parsed_data"
        on_error: "fail"

      # Step 3: Validate against schema
      - id: "validate"
        action: "json.validate"
        params:
          data: "${parse_json.parsed_data}"
          schema_path: "${SCHEMA_PATH}"
        output: "validation_result"
        on_error: "fail"

      # Step 4: Branch based on validation result
      - id: "check_validation"
        action: "conditional"
        condition: "${validate.validation_result.valid} == true"

        # If validation passed
        if_true:
          - id: "move_to_processed"
            action: "file.move"
            params:
              source: "${trigger.file_path}"
              dest: "${PROCESSED_PATH}/${trigger.file_name}"
            on_error: "fail"

          - id: "log_success"
            action: "log"
            params:
              level: "info"
              message: "✓ Validated and processed: ${trigger.file_name}"

        # If validation failed
        if_false:
          - id: "log_errors"
            action: "file.write"
            params:
              path: "${ERRORS_PATH}/${trigger.file_name}.log"
              content: "Validation errors: ${validate.validation_result.errors}"
            on_error: "fail"

          - id: "log_failure"
            action: "log"
            params:
              level: "warning"
              message: "✗ Validation failed: ${trigger.file_name} - ${validate.validation_result.errors}"

# ============================================================================
# TOOLS: What capabilities are available?
# ============================================================================

tools:
  # File operations
  - name: "file.read"
    enabled: true
    description: "Read file contents"

  - name: "file.write"
    enabled: true
    description: "Write content to file"

  - name: "file.move"
    enabled: true
    description: "Move or rename file"

  - name: "file.find"
    enabled: true
    description: "Find files matching pattern"

  # JSON operations
  - name: "json.parse"
    enabled: true
    description: "Parse JSON string to object"

  - name: "json.validate"
    enabled: true
    description: "Validate JSON against schema"

  - name: "json.stringify"
    enabled: true
    description: "Convert object to JSON string"

  # Logging
  - name: "log"
    enabled: true
    description: "Write to log with specified level"

  # Message (stub - v0.5 will work)
  - name: "message.send"
    enabled: true
    description: "Send message to another agent"

# ============================================================================
# LOGGING & MONITORING
# ============================================================================

logging:
  level: "${LOG_LEVEL:info}"  # Options: debug, info, warning, error
  file: "${LOG_FILE:./logs/file_validator.log}"
  format: "json"
  log_triggers: true
  log_workflow_steps: true
  log_tool_calls: true
  max_size_mb: 100
  backup_count: 5

monitoring:
  enabled: true
  track:
    - events_processed
    - workflow_success_rate
    - tool_execution_time
